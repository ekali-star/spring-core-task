spring:
  application:
    name: gymcrm
  profiles:
    active: local
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.gymcrm: DEBUG

jwt:
  secret: your-256-bit-secret-key-here-must-be-at-least-32-chars
  expiration-ms: 86400000

cors:
  allowed-origins:
    - http://localhost:3000
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - Authorization
    - Content-Type

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

auth-server:
  token-url: http://localhost:9000/oauth2/token
  client-id: gymcrm
  client-secret: gymcrm-secret

resilience4j:
  circuitbreaker:
    instances:
      trainerWorkload:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2